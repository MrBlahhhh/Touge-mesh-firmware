; Host tests for the Touge fast-mesh overlay.
;
; The firmware itself is not built here. It builds inside a Meshtastic
; checkout, because it is a module in that tree rather than a program of its
; own: see README.md and apply-overlay.sh.
;
; What lives here is the part worth testing without hardware. The wire format,
; the key derivation and the flood suppression have to agree between a phone, a
; board, and every other board, and none of them need a radio to check.
;
;   pio test -e native

[platformio]
src_dir = overlay/src/touge

[env:native]
platform = native
test_framework = unity
; Without this `pio test` builds the test and Unity and nothing else, so every
; symbol in touge/ comes up undefined at link time. It is the reason these
; tests had never once run: the filter below was correct and never consulted.
test_build_src = true
build_flags =
  -std=gnu++17
  -Wall
  -D TOUGE_NATIVE=1
  ; Without this Unity compiles its 64-bit assertions out, and the ride clock
  ; tests that compare microsecond counters pass by not running. Only visible
  ; under a 32-bit toolchain, which is what PlatformIO supplies if w64devkit is
  ; not on PATH - so the suite was green two different ways.
  -D UNITY_SUPPORT_64
  -I overlay/src/touge
build_unflags = -std=gnu++11
; cipher.cpp and espnow.cpp want mbedtls and the ESP-IDF, neither of which
; exists on a laptop. Everything else here is deliberately platform-free.
build_src_filter = +<frame.cpp> +<sha256.cpp> +<hmac.cpp> +<ride.cpp> +<mesh.cpp> +<schedule.cpp> +<rideclock.cpp> +<hop.cpp>
