; Host tests for the Touge fast-mesh overlay.
;
; The firmware itself is not built here. It builds inside a Meshtastic
; checkout, because it is a module in that tree rather than a program of its
; own: see README.md and apply-overlay.sh.
;
; What lives here is the part worth testing without hardware. The wire format,
; the key derivation and the flood suppression have to agree between a phone, a
; board, and every other board, and none of them need a radio to check.
;
;   pio test -e native

[platformio]
src_dir = overlay/src/touge

[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -D TOUGE_NATIVE=1
  -I overlay/src/touge
build_unflags = -std=gnu++11
; cipher.cpp and espnow.cpp want mbedtls and the ESP-IDF, neither of which
; exists on a laptop. Everything else here is deliberately platform-free.
build_src_filter = +<frame.cpp> +<sha256.cpp> +<ride.cpp> +<mesh.cpp> +<schedule.cpp> +<rideclock.cpp>
